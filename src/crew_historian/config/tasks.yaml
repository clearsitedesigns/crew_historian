search_task:
  description: >
    Use web search to find **concise historical background** and **relevant imagery links**
    for the given topic. Focus on clarity, credibility, and visual references.
  expected_output: >
    A paragraph summary of the topic AND a list of 2-3 direct image URLs (ending in .jpg, .png, or .webp).

image_analysis_task:
  description: >
    Examine the provided image and describe its **visual elements**, **composition**, and any
    historical or artistic details that could aid contextual understanding.
  expected_output: >
    A visual analysis that identifies objects, people, architecture, artistic style, or symbolism present in the image.

vision_task:
  description: >
    Use the image analysis to **summarize what the image contributes** to our understanding of the topic.
    Add details that link visual elements to historical context.
  expected_output: >
    A paragraph explaining the relevance of the image to the topic.

history_context_task:
  description: >
    Provide deeper historical context using the search and image inputs.
    Highlight **timelines, cultural impact, geography**, and **key figures**.
  expected_output: >
    A detailed but accessible historical overview.

writeup_task:
  description: >
    Write a cohesive, insightful article using the previous outputs.
    Ensure the tone is educational and visually descriptive.
  expected_output: >
    A 3–5 paragraph educational article.

final_visualization_task:
  description: >
    Generate a **custom visual summary** that visually represents the topic.
    This could be a concept collage, diagram, or art piece based on your understanding.
  expected_output: >
    A creative visual generation prompt and result.
